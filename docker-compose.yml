name: champ

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: champ
      POSTGRES_PASSWORD: champ
      POSTGRES_DB: champ
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champ -d champ"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # The official minio/minio image is no longer published on Docker Hub;
    # pgsty/minio is a maintained, drop-in build of the same server.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: champ
      MINIO_ROOT_PASSWORD: champchamp
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
