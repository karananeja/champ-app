<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Champ</title>
    <script>
      // Theme (CR-03, CR-09): the saved choice in localStorage "champ-theme" (light | dark), else the OS setting. The
      // .dark class switches the theme tokens in index.css; src/lib/theme.ts keeps it in sync after load.
      (function () {
        var stored = null;
        try { stored = window.localStorage.getItem('champ-theme'); } catch (e) {}
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
